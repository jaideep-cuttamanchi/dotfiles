unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s

# Don't detach the client when the last pane in a session exits
set -g detach-on-destroy off

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# vim-style copy mode (v for selection, y for copy)
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

# Default split/new-window start in the session's original cwd (~).
# -c "#{pane_current_path}" makes " / % / c inherit the active pane's cwd instead.
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Session switcher: enter jumps to the session, D deletes it
bind s display-popup -E "\
    tmux list-sessions -F '#{session_name}' | fzf --reverse \
        --header 'enter: switch    D: delete' \
        --preview 'tmux capture-pane -pt {}' \
        --bind 'enter:execute-silent(tmux switch-client -t {})+abort' \
        --bind 'D:execute(tmux kill-session -t {})+reload(tmux list-sessions -F \"#{session_name}\")'"

# Window switcher: enter jumps to the window, D deletes it
bind w display-popup -E "\
    tmux list-windows -F '#{window_index}	#{window_name}' | fzf --reverse --with-nth=2 \
        --header 'enter: switch    D: delete' \
        --preview 'tmux capture-pane -pt {1}' \
        --bind 'enter:execute-silent(tmux select-window -t {1})+abort' \
        --bind 'D:execute(tmux kill-window -t {1})+reload(tmux list-windows -F \"#{window_index}	#{window_name}\")'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'momo-lab/tmux-toggle-scratch'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

# Autosave/restore tmux state (continuum builds on resurrect)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# One scratch popup per tmux session; toggle with prefix + `
set -g @toggle-scratch-keys '`'
set -g @toggle-scratch-session-name-format '#S@scratch'
set -g @toggle-scratch-popup-options '-w100% -h40% -x0 -yS'

set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g status-position bottom
set -g extended-keys
set -g extended-keys-format csi-u
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Dracula treats empty @dracula-plugins as unset and restores battery/network/weather.
set -g status-right ''
